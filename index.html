<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 토탈 운세 센터</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            text-align: center;
            padding: 40px 0 30px;
        }
        .hero h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .hero p { color: var(--text-sub); font-size: 0.95rem; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        @media (min-width: 480px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            position: relative;
            box-shadow: var(--shadow-subtle);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        .menu-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .menu-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 20px; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .badge-indigo { background: #e0e7ff; color: #4338ca; }
        .badge-emerald { background: #d1fae5; color: #047857; }
        .badge-amber { background: #fef3c7; color: #b45309; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
    </style>
</head>
<body>

    <nav class="app-nav">
        <a href="index.html" class="nav-brand">🔮 AI 운세 센터</a>
    </nav>

    <div class="app-container">
        <div class="hero">
            <h1>어떤 운세를 확인하시겠어요?</h1>
            <p>인공지능 비전과 정통 명리로 풀어보는 나만의 운세</p>
        </div>

        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <script src="menu-data.js"></script>
    <script>
        const grid = document.getElementById('menuGrid');
        fortuneMenus.forEach(menu => {
            const card = document.createElement('a');
            card.href = menu.url;
            card.className = 'menu-card';
            card.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                        <span style="font-size: 1.6rem;">${menu.icon || '✨'}</span>
                        <span class="badge badge-${menu.theme}">${menu.badge}</span>
                    </div>
                    <h3>${menu.title}</h3>
                    <p>${menu.desc}</p>
                </div>
                <div class="card-footer">
                    <span>시작하기</span>
                    <span>&rarr;</span>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
