<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 토탈 운세 센터</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            text-align: center;
            padding: 40px 0 30px;
        }
        .hero h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .hero p { color: var(--text-sub); font-size: 0.95rem; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        @media (min-width: 480px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            position: relative;
            box-shadow: var(--shadow-subtle);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        /* 비활성화(준비중) 메뉴 스타일 */
        .menu-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
            background: var(--bg-secondary);
        }

        .menu-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .menu-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 20px; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .badge-indigo { background: #e0e7ff; color: #4338ca; }
        .badge-emerald { background: #d1fae5; color: #047857; }
        .badge-amber { background: #fef3c7; color: #b45309; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }
    </style>
</head>
<body>

    <nav class="app-nav">
        <a href="index.html" class="nav-brand">🔮 AI 운세 센터</a>
    </nav>

    <div class="app-container">
        <div class="hero">
            <h1>어떤 운세를 확인하시겠어요?</h1>
            <p>인공지능 비전과 정통 명리로 풀어보는 나만의 운세</p>
        </div>

        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <script>
        // 내부 데이터 직접 정의 (관상 분석 아이콘을 정상적인 이모지 '👤'로 수정)
        const fortuneMenus = [
            {
                title: "AI 손금(수상) 분석",
                desc: "인공지능 비전 기술로 손금 라인을 정밀하게 분석합니다.",
                url: "palm.html",
                icon: "✋",
                badge: "AI Vision",
                theme: "emerald"
            },
            {
                title: "AI 관상 분석",
                desc: "얼굴 랜드마크를 분석하여 성향과 운세를 풀어드립니다.",
                url: "face.html",
                icon: "👤",
                badge: "AI Vision",
                theme: "indigo"
            },
            {
                title: "정통사주명리",
                desc: "태어난 사주 원국을 바탕으로 깊이 있는 운세를 확인합니다.",
                url: "saju.html",
                icon: "📜",
                badge: "정통 명리",
                theme: "amber"
            },
            {
                title: "신토정비결",
                desc: "한 해의 흐름과 시기별 조언을 명쾌하게 풀어드립니다.",
                url: "tojeong.html",
                icon: "📖",
                badge: "신년 운세",
                theme: "purple"
            }
        ];

        const grid = document.getElementById('menuGrid');
        
        // 정통사주명리 및 신토정비결 서비스 준비중 처리 키워드
        const preparingKeywords = ["정통사주명리", "신토정", "사주명리"];

        fortuneMenus.forEach(menu => {
            const isPreparing = preparingKeywords.some(keyword => menu.title.includes(keyword));
            const card = document.createElement(isPreparing ? 'div' : 'a');
            
            if (!isPreparing) {
                card.href = menu.url;
            }
            
            card.className = `menu-card ${isPreparing ? 'disabled' : ''}`;
            
            card.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                        <span style="font-size: 1.8rem;">${menu.icon || '✨'}</span>
                        <span class="badge ${isPreparing ? 'badge-gray' : 'badge-' + menu.theme}">${isPreparing ? '준비중' : menu.badge}</span>
                    </div>
                    <h3>${menu.title}</h3>
                    <p>${menu.desc}</p>
                </div>
                <div class="card-footer">
                    <span>${isPreparing ? '서비스 준비중' : '시작하기'}</span>
                    <span>${isPreparing ? '⏳' : '&rarr;'}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
