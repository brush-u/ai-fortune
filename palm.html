<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 AI 손금 - 카메라 안정화 버전</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f1f5f9;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(env(safe-area-inset-top), 6px) 6px max(env(safe-area-inset-bottom), 6px) 6px;
    }

    .app-nav {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      margin-bottom: 2px;
      font-size: 0.85rem;
    }
    .nav-brand { font-weight: bold; color: #4338ca; text-decoration: none; }
    .nav-home-btn { color: #64748b; text-decoration: none; cursor: pointer; background: transparent; border: none; font-size: 0.85rem; }

    .container {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    h1 { font-size: 1.12rem; color: #047857; display: inline-block; }

    .guide-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      text-align: left;
      font-size: 0.75rem;
      line-height: 1.35;
      color: #334155;
    }
    .guide-box .guide-title { color: #059669; font-weight: bold; margin-bottom: 2px; }
    .guide-box ul { padding-left: 14px; }
    
    .status-msg {
      background: #fef2f2;
      color: #991b1b;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 6px;
      font-weight: bold;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      border: 1px solid #fecaca;
    }
    .status-msg.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-msg.info {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 2px solid #e2e8f0;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, canvas, #snapshot-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* 기본 숨김 */
    }

    video { z-index: 1; } /* 로딩 완료 시 JS에서 display block 처리 */
    #snapshot-img { z-index: 2; }
    canvas { pointer-events: none; z-index: 3; display: block; }

    .palm-guide-frame {
      position: absolute;
      top: 15%; left: 15%; width: 70%; height: 70%;
      border: 2px dashed rgba(16, 185, 129, 0.8);
      border-radius: 20px;
      z-index: 4;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .palm-guide-frame span {
      background: rgba(0, 0, 0, 0.75);
      color: #a7f3d0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    .scan-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    .scan-overlay.active { display: block; }
    .scan-line {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, #10b981, #34d399, #10b981, transparent);
      box-shadow: 0 0 15px #10b981, 0 0 25px #34d399;
      animation: scan-move 1.5s linear infinite;
    }
    @keyframes scan-move {
      0% { top: 0%; }
      50% { top: 92%; }
      100% { top: 0%; }
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .cam-switch-btn {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .cam-switch-btn:disabled { opacity: 0.5; cursor: wait; }

    .main-btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .main-btn {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border: none;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      flex: 2;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .main-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .reset-scan-btn {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
      display: none;
      text-align: center;
    }

    .result-card {
      margin-top: 8px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      display: none;
      border: 1px solid #e2e8f0;
      font-size: 0.92rem;
      box-sizing: border-box;
      width: 100%;
    }
    .result-card h3 { 
      color: #047857; 
      margin-bottom: 8px; 
      font-size: 1.15rem; 
      text-align: center; 
      border-bottom: 1px solid #e2e8f0; 
      padding-bottom: 6px; 
    }

    .fortune-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .fortune-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 8px 4px;
      border-radius: 6px;
      text-align: center;
    }
    .fortune-box .f-title { font-size: 0.73rem; color: #64748b; margin-bottom: 2px; font-weight: bold; }
    .fortune-box .f-score { font-size: 0.95rem; font-weight: bold; color: #059669; }

    .detail-section {
      background: #ffffff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
      word-break: keep-all;
    }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .detail-section h4 { font-size: 0.95rem; font-weight: bold; }

    .shape-desc { font-size: 0.83rem; margin-bottom: 4px; font-weight: bold; }
    .original-data { font-size: 0.82rem; color: #334155; line-height: 1.45; margin-bottom: 6px; background: #f8fafc; padding: 6px; border-radius: 5px; border: 1px solid #e2e8f0; }
    .analysis-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    
    .good-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 8px; border-radius: 5px; font-size: 0.83rem; line-height: 1.45; color: #166534; }
    .bad-box { background: #fef2f2; border: 1px solid #fecaca; padding: 8px; border-radius: 5px; font-size: 0.83rem; line-height: 1.45; color: #991b1b; }

    .legend-box {
      display: flex;
      justify-content: space-around;
      background: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      border: 1px solid #e2e8f0;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

  <nav class="app-nav">
    <a href="#" class="nav-brand">🔮 AI 운세 센터</a>
    <button class="nav-home-btn" onclick="goHome()">🏠 AI 운세 센터 홈</button>
  </nav>

  <div class="container">
    <div class="app-header">
      <h1>실시간 AI 손금</h1>
    </div>

    <div class="guide-box">
      <div class="guide-title">✨ 카메라 전환 안정화 완료</div>
      <ul>
        <li>카메라 전환 버튼을 눌러 앞/뒤 카메라를 안전하게 토글합니다. 화면이 검게 나오면 잠시 기다려주세요.</li>
      </ul>
    </div>

    <div class="top-controls">
      <button id="btn-switch-cam" class="cam-switch-btn" onclick="switchCamera()">🔄 카메라 전환</button>
      <div id="ai-status-badge" style="font-size: 0.78rem; color: #dc2626; font-weight: bold;">🔴 준비중</div>
    </div>

    <div id="status" class="status-msg info">⚠️ 카메라 권한을 확인 중입니다...</div>

    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
      <img id="snapshot-img" alt="Captured Palm">
      <canvas id="output_canvas"></canvas>

      <div id="palm-guide-frame" class="palm-guide-frame">
        <span>✋ 손바닥을 여기에 밀착하세요</span>
      </div>

      <div id="scan
