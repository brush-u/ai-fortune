<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 AI 손금</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f1f5f9;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(env(safe-area-inset-top), 6px) 6px max(env(safe-area-inset-bottom), 6px) 6px;
    }

    .app-nav {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      margin-bottom: 2px;
      font-size: 0.85rem;
    }
    .nav-brand { font-weight: bold; color: #4338ca; text-decoration: none; }
    .nav-home-btn { color: #64748b; text-decoration: none; cursor: pointer; background: transparent; border: none; font-size: 0.85rem; }

    .container {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    h1 { font-size: 1.12rem; color: #047857; display: inline-block; }

    .guide-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      text-align: left;
      font-size: 0.75rem;
      line-height: 1.35;
      color: #334155;
    }
    .guide-box .guide-title { color: #059669; font-weight: bold; margin-bottom: 2px; }
    .guide-box ul { padding-left: 14px; }
    
    .status-msg {
      background: #fef2f2;
      color: #991b1b;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 6px;
      font-weight: bold;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      border: 1px solid #fecaca;
    }
    .status-msg.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 2px solid #e2e8f0;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, canvas, #snapshot-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video { z-index: 1; display: block; transform: scaleX(-1); }
    #snapshot-img { z-index: 2; display: none; transform: scaleX(-1); }
    canvas { pointer-events: none; z-index: 3; }

    .palm-guide-frame {
      position: absolute;
      top: 15%; left: 15%; width: 70%; height: 70%;
      border: 2px dashed rgba(16, 185, 129, 0.8);
      border-radius: 20px;
      z-index: 4;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .palm-guide-frame span {
      background: rgba(0, 0, 0, 0.75);
      color: #a7f3d0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    .scan-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    .scan-overlay.active { display: block; }
    .scan-line {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, #10b981, #34d399, #10b981, transparent);
      box-shadow: 0 0 15px #10b981, 0 0 25px #34d399;
      animation: scan-move 1.5s linear infinite;
    }
    @keyframes scan-move {
      0% { top: 0%; }
      50% { top: 92%; }
      100% { top: 0%; }
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .cam-switch-btn {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .main-btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .main-btn {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border: none;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      flex: 2;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .main-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .reset-scan-btn {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
      display: none;
      text-align: center;
    }

    .result-card {
      margin-top: 8px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      display: none;
      border: 1px solid #e2e8f0;
      font-size: 0.92rem;
      box-sizing: border-box;
      width: 100%;
    }
    .result-card h3 { 
      color: #047857; 
      margin-bottom: 8px; 
      font-size: 1.15rem; 
      text-align: center; 
      border-bottom: 1px solid #e2e8f0; 
      padding-bottom: 6px; 
    }

    .fortune-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .fortune-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 8px 4px;
      border-radius: 6px;
      text-align: center;
    }
    .fortune-box .f-title { font-size: 0.73rem; color: #64748b; margin-bottom: 2px; font-weight: bold; }
    .fortune-box .f-score { font-size: 0.95rem; font-weight: bold; color: #059669; }

    .detail-section {
      background: #ffffff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
      word-break: keep-all;
    }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .detail-section h4 { font-size: 0.95rem; font-weight: bold; }

    .shape-desc { font-size: 0.83rem; margin-bottom: 4px; font-weight: bold; }
    .original-data { font-size: 0.82rem; color: #334155; line-height: 1.45; margin-bottom: 6px; background: #f8fafc; padding: 6px; border-radius: 5px; border: 1px solid #e2e8f0; }
    .analysis-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    
    .good-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 8px; border-radius: 5px; font-size: 0.83rem; line-height: 1.45; color: #166534; }
    .bad-box { background: #fef2f2; border: 1px solid #fecaca; padding: 8px; border-radius: 5px; font-size: 0.83rem; line-height: 1.45; color: #991b1b; }

    .legend-box {
      display: flex;
      justify-content: space-around;
      background: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      border: 1px solid #e2e8f0;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

  <nav class="app-nav">
    <a href="#" class="nav-brand">🔮 AI 운세 센터</a>
    <button class="nav-home-btn" onclick="goHome()">🏠 AI 운세 센터 홈</button>
  </nav>

  <div class="container">
    <div class="app-header">
      <h1>실시간 AI 손금</h1>
    </div>

    <div class="guide-box">
      <div class="guide-title">✨ 4대 손금 완벽 분석 (점 유지 및 좌표 보정)</div>
      <ul>
        <li><strong>스캔 후 점/선 유지:</strong> 캡처 후에도 손바닥 안쪽으로 선과 관절 포인트가 깔끔하게 고정됩니다.</li>
      </ul>
    </div>

    <div class="top-controls">
      <button class="cam-switch-btn" onclick="switchCamera()">🔄 카메라 전환</button>
      <div id="ai-status-badge" style="font-size: 0.78rem; color: #dc2626; font-weight: bold;">🔴 손 인식 대기중</div>
    </div>

    <div id="status" class="status-msg">⚠️ 화면 중앙 가이드에 손바닥 안쪽을 꽉 채워주세요.</div>

    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
      <img id="snapshot-img" alt="Captured Palm">
      <canvas id="output_canvas"></canvas>

      <div id="palm-guide-frame" class="palm-guide-frame">
        <span>✋ 손바닥을 여기에 밀착하세요</span>
      </div>

      <div id="scan-overlay" class="scan-overlay">
        <div class="scan-line"></div>
      </div>
    </div>

    <button id="btn-reset-scan" class="reset-scan-btn" onclick="resetToCamView()">↩️ 다시 촬영하기</button>

    <div class="main-btn-group" id="btn-group-action">
      <button id="btn-action" class="main-btn" onclick="startPalmScan()">✋ AI 손금 정밀 스캔 및 분석</button>
    </div>

    <div class="legend-box">
      <div class="legend-item"><span class="dot" style="background:#f59e0b;"></span>생명선</div>
      <div class="legend-item"><span class="dot" style="background:#3b82f6;"></span>두뇌선</div>
      <div class="legend-item"><span class="dot" style="background:#10b981;"></span>운명선</div>
      <div class="legend-item"><span class="dot" style="background:#ec4899;"></span>감정선</div>
    </div>

    <div id="result" class="result-card">
      <h3>📊 AI 손금(수상) 4대 정밀 분석 리포트</h3>

      <div class="fortune-grid">
        <div class="fortune-box"><div class="f-title">❤️ 생명선</div><div class="f-score">96점 💪</div></div>
        <div class="fortune-box"><div class="f-title">💡 두뇌선</div><div class="f-score">94점 🧠</div></div>
        <div class="fortune-box"><div class="f-title">💰 운명선</div><div class="f-score">95점 🚀</div></div>
        <div class="fortune-box"><div class="f-title">💖 감정선</div><div class="f-score">97점 ✨</div></div>
      </div>

      <div id="details-container"></div>

      <div class="detail-section" style="border-left: 3px solid #059669; margin-top: 6px;">
        <div class="detail-header"><h4 style="color: #065f46;">💡 종합 평론 및 개운 조언</h4></div>
        <p id="desc-summary" style="font-size: 0.88rem; line-height: 1.45; color: #334155;">-</p>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById("webcam");
    const snapshotImg = document.getElementById("snapshot-img");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const statusMsg = document.getElementById("status");
    const resultCard = document.getElementById("result");
    const scanOverlay = document.getElementById("scan-overlay");
    const btnResetScan = document.getElementById("btn-reset-scan");
    const btnGroupAction = document.getElementById("btn-group-action");
    const palmGuideFrame = document.getElementById("palm-guide-frame");
    const aiStatusBadge = document.getElementById("ai-status-badge");
    const btnAction = document.getElementById("btn-action");

    let mediaStream = null;
    let useFrontCamera = true;
    let isHandDetected = false;
    let isScanningDone = false;
    let handsInstance = null;
    let cameraInstance = null;
    let latestLandmarks = null;

    function goHome() {
      if (window.history.length > 1) { window.history.back(); } else { location.href = '/'; }
    }

    function onResults(results) {
      if (isScanningDone) return;

      const w = canvas.clientWidth || 360;
      const h = canvas.clientHeight || 480;
      canvas.width = w;
      canvas.height = h;
      ctx.clearRect(0, 0, w, h);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        isHandDetected = true;
        latestLandmarks = results.multiHandLandmarks[0];
        
        statusMsg.className = "status-msg success";
        statusMsg.innerText = "✅ 손바닥 영역 포착 완료! [스캔 시작]을 누르세요.";
        aiStatusBadge.style.color = "#059669";
        aiStatusBadge.innerText = "🟢 정밀 포착됨";
        btnAction.classList.add("active");

        const landmarks = latestLandmarks;
        
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        ctx.lineWidth = 2;
        
        const connections = [
          [0,1],[1,2],[2,3],[3,4],
          [0,5],[5,6],[6,7],[7,8],
          [5,9],[9,10],[10,11],[11,12],
          [9,13],[13,14],[14,15],[15,16],
          [13,17],[17,18],[18,19],[19,20],[0,17]
        ];
        connections.forEach(([i, j]) => {
          const p1 = landmarks[i];
          const p2 = landmarks[j];
          ctx.beginPath();
          ctx.moveTo(p1.x * w, p1.y * h);
          ctx.lineTo(p2.x * w, p2.y * h);
          ctx.stroke();
        });

        landmarks.forEach(pt => {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(pt.x * w, pt.y * h, 3.5, 0, 2 * Math.PI);
          ctx.fill();
        });

      } else {
        isHandDetected = false;
        latestLandmarks = null;
        statusMsg.className = "status-msg";
        statusMsg.innerText = "⚠️ 손바닥을 카메라 가이드 안에 밀착해 주세요.";
        aiStatusBadge.style.color = "#dc2626";
        aiStatusBadge.innerText = "🔴 손 인식 대기중";
        btnAction.classList.remove("active");
      }
    }

    async function initHandsAI() {
      try {
        if (!handsInstance) {
          handsInstance = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
          });
          handsInstance.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
          });
          handsInstance.onResults(onResults);
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const constraints = {
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: useFrontCamera ? "user" : "environment" },
            audio: false
          };
          mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = mediaStream;
          await video.play();

          if (cameraInstance) {
            cameraInstance.stop();
          }

          cameraInstance = new Camera(video, {
            onFrame: async () => {
              if (!isScanningDone && video.readyState >= 2) {
                await handsInstance.send({ image: video });
              }
            },
            width: 1280,
            height: 720
          });
          cameraInstance.start();
        }
      } catch (err) {
        statusMsg.className = "status-msg";
        statusMsg.innerText = "⚠️ 카메라 권한을 허용해 주시거나 브라우저 설정을 확인해 주세요.";
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (cameraInstance) {
        cameraInstance.stop();
      }
      initHandsAI();
    }

    function startPalmScan() {
      if (!isHandDetected || !latestLandmarks || isScanningDone) return;
      isScanningDone = true;

      const w = canvas.clientWidth || 360;
      const h = canvas.clientHeight || 480;
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth || 640;
      tempCanvas.height = video.videoHeight || 480;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      
      snapshotImg.src = tempCanvas.toDataURL('image/png');
      snapshotImg.style.display = "block";
      video.style.display = "none";

      palmGuideFrame.style.display = "none";
      scanOverlay.classList.add("active");
      statusMsg.className = "status-msg success";
      statusMsg.innerText = "🔍 손바닥 이미지 고정 완료! 손금 좌표 정밀 보정 중...";

      setTimeout(() => {
        scanOverlay.classList.remove("active");
        
        canvas.width = w;
        canvas.height = h;
        ctx.clearRect(0, 0, w, h);

        const wrist = latestLandmarks[0];
        const indexBase = latestLandmarks[5];
        const pinkyBase = latestLandmarks[17];
        const thumbBase = latestLandmarks[1];

        const pX = (indexBase.x + pinkyBase.x) / 2 * w;
        const pY = (wrist.y + indexBase.y) / 2 * h;
        const palmWidth = Math.abs(indexBase.x - pinkyBase.x) * w;

        ctx.save();
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';

        latestLandmarks.forEach(pt => {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(pt.x * w, pt.y * h, 3.5, 0, 2 * Math.PI);
          ctx.fill();
        });

        // 1. 생명선 (주황색)
        ctx.strokeStyle = '#f59e0b';
        ctx.beginPath(); 
        ctx.moveTo(thumbBase.x * w, thumbBase.y * h); 
        ctx.bezierCurveTo(thumbBase.x * w - palmWidth * 0.18, pY, pX - palmWidth * 0.1, wrist.y * h - palmWidth * 0.15, wrist.x * w + palmWidth * 0.1, wrist.y * h - palmWidth * 0.05); 
        ctx.stroke();

        // 2. 두뇌선 (파란색)
        ctx.strokeStyle = '#3b82f6';
        ctx.beginPath(); 
        ctx.moveTo(thumbBase.x * w + palmWidth * 0.08, pY - palmWidth * 0.08); 
        ctx.bezierCurveTo(pX, pY - palmWidth * 0.04, pinkyBase.x * w - palmWidth * 0.1, pY - palmWidth * 0.02, pinkyBase.x * w - palmWidth * 0.05, pY + palmWidth * 0.05); 
        ctx.stroke();

        // 3. 운명선 (청록색)
        ctx.strokeStyle = '#10b981';
        ctx.beginPath(); 
        ctx.moveTo(wrist.x * w + palmWidth * 0.15, wrist.y * h); 
        ctx.bezierCurveTo(wrist.x * w + palmWidth * 0.15, pY + palmWidth * 0.15, pX, pY, pX, pY - palmWidth * 0.25); 
        ctx.stroke();

        // 4. 감정선 (핑크색)
        ctx.strokeStyle = '#ec4899';
        ctx.beginPath(); 
        ctx.moveTo(indexBase.x * w, indexBase.y * h + palmWidth * 0.08); 
        ctx.bezierCurveTo(pX, indexBase.y * h - palmWidth * 0.02, pinkyBase.x * w, pinkyBase.y * h + palmWidth * 0.08, pinkyBase.x * w - palmWidth * 0.05, pinkyBase.y * h + palmWidth * 0.05); 
        ctx.stroke();

        ctx.restore();

        generateDetailedReport();
        
        statusMsg.innerText = "✨ 손바닥 맞춤 손금 정밀 분석이 완료되었습니다!";
        aiStatusBadge.innerText = "✅ 분석 완료";

        btnResetScan.style.display = "block";
        btnGroupAction.style.display = "none";
      }, 1500);
    }

    function resetToCamView() {
      isScanningDone = false;
      resultCard.style.display = "none";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      snapshotImg.style.display = "none";
      video.style.display = "block";
      
      palmGuideFrame.style.display = "flex";
      btnResetScan.style.display = "none";
      btnGroupAction.style.display = "flex";
      btnAction.classList.remove("active");
      
      statusMsg.className = "status-msg";
      statusMsg.innerText = "⚠️ 화면 중앙 가이드에 손바닥 안쪽을 꽉 채워주세요.";
      aiStatusBadge.style.color = "#dc2626";
      aiStatusBadge.innerText = "🔴 손 인식 대기중";
    }

    function generateDetailedReport() {
      const detailsDiv = document.getElementById("details-container");
